<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>jQuery UI로 행 순서 변경</title>
  <style>
    body { max-width: 700px; margin: 40px auto; padding: 0 20px; font: 16px/1.6 system-ui, sans-serif; }
    table { width: 100%; border-collapse: collapse; table-layout: fixed; }
    th, td { border: 1px solid #ccc; padding: 12px; text-align: left; }
    tbody tr { cursor: grab; background: white; }
    .dragging { opacity: .4; }
    .drop-before { box-shadow: inset 0 3px #1677ff; }
    .drop-after { box-shadow: inset 0 -3px #1677ff; }
  </style>
</head>
<body>
  <nav><a href="index.html">테이블 읽기 연습</a> · <a href="table-drag-drop.html">직접 구현 예제</a></nav>
  <h1>jQuery UI로 행 순서 변경</h1>
  <p>데스크톱에서 행을 마우스로 끌어 순서를 바꿔 보세요. 놓으면 순서가 확정됩니다.</p>
  <table id="taskTable">
    <thead><tr><th scope="col">ID</th><th scope="col">할 일</th></tr></thead>
    <tbody>
      <tr data-id="1"><td>1</td><td>HTML 공부</td></tr>
      <tr data-id="2"><td>2</td><td>CSS 공부</td></tr>
      <tr data-id="3"><td>3</td><td>jQuery 공부</td></tr>
      <tr data-id="4"><td>4</td><td>프로젝트 만들기</td></tr>
    </tbody>
  </table>
  <p aria-live="polite">현재 순서: <span id="order">1 → 2 → 3 → 4</span></p>
  <p>새로고침하면 처음 순서로 돌아갑니다. 라이브러리를 불러오려면 인터넷 연결이 필요합니다.</p>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://code.jquery.com/ui/1.14.2/jquery-ui.min.js"></script>
  <script>
    function showOrder() {
      const ids = $("#taskTable tbody > tr").map(function () {
        return $(this).attr("data-id");
      }).get();
      $("#order").text(ids.join(" → "));
      return ids;
    }

    // table 대신 tbody를 정렬 대상으로 지정합니다.
    $("#taskTable tbody").sortable({
      items: "> tr",
      axis: "y",
      helper: function (event, row) {
        const helper = row.clone();
        helper.children().each(function (index) {
          $(this).width(row.children().eq(index).width());
        });
        return helper;
      },
      update: function () {
        showOrder();
      }
    });
  </script>
</body>
</html>
